; The scans for scripts\measure_scans.py. Copy this file, fill in the paths,
; and check and start every scan with
;   python scripts\measure_scans.py scans.ini
;
; Every key is an option of measure_stripes.py without its two dashes:
; "reference-page = 3" is --reference-page 3, "no-reject = yes" is --no-reject,
; and "no" leaves an option out. Write paths as they are, backslashes and all.
; A relative path is taken from the folder of this file.

; For every scan. A scan's own section can set any of these again.
[DEFAULT]
reference = D:\ACTIS\reference\holes.tiff
reference-page = 0
method = all
; The 32 columns that neighbouring stripes share, kept to align the stripes
; later without reading the scans again: 188 MB per 1,500-page segment.
edge-strips = 32

; One section per scan: the scan folder (with header.xml), a new folder for its
; results, and the GPU that measures it, numbered as nvidia-smi numbers them.
[scan-A]
root = D:\ACTIS\scan-A
output = D:\ACTIS\results\scan-A
gpu = 0

[scan-B]
root = D:\ACTIS\scan-B
output = D:\ACTIS\results\scan-B
gpu = 1

[scan-C]
root = D:\ACTIS\scan-C
output = D:\ACTIS\results\scan-C
gpu = 2
